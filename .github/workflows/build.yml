name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install JS deps and bundle the backend
        run: |
          npm ci
          npm ci --prefix js
          node js/build.js
      - name: Native layer tests
        run: cargo test -p mutagen-io --release
      - name: Core tests (no saves needed)
        run: node --test test/unit.test.js
      - name: Build app + installer
        run: npx tauri build --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/Mutagen.exe out/Mutagen.exe
          Copy-Item target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Format-Table Name, Length
          Get-FileHash out/* -Algorithm SHA256 | Format-Table Hash, Path
      - uses: actions/upload-artifact@v4
        with:
          name: Mutagen-windows
          path: out/*
          if-no-files-found: error
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Mutagen ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: out/*
      - name: Copy build to the 'builds' branch (for verification)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/b && cp out/* /tmp/b/
          git switch --orphan builds-tmp
          git rm -rf . -q || true
          cp /tmp/b/* . && sha256sum *.exe > SHA256SUMS.txt && echo "${GITHUB_SHA}" > COMMIT.txt
          git add -A && git commit -qm "Build of ${GITHUB_SHA}"
          git push -f origin HEAD:builds
