name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install JS deps and bundle the backend
        run: |
          npm ci
          npm ci --prefix js
          node js/build.js
      - name: Native layer tests
        run: cargo test -p mutagen-io --release
      - name: Core tests (no saves needed)
        run: node --test test/unit.test.js
      - name: Build app + installer
        run: npx tauri build --bundles nsis
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/Mutagen.exe out/Mutagen.exe
          Copy-Item target/release/bundle/nsis/*.exe out/
          Get-ChildItem out | Format-Table Name, Length
          Get-FileHash out/* -Algorithm SHA256 | Format-Table Hash, Path
      - uses: actions/upload-artifact@v4
        with:
          name: Mutagen-windows
          path: out/*
          if-no-files-found: error
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
