[package]
name = "mutagen-io"
version = "1.1.0"
edition = "2021"
description = "File, pak and icon primitives for Mutagen"

[dependencies]
flate2 = "1"
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = { version = "0.13", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[[bin]]
name = "mutagen-io-cli"
path = "src/bin/cli.rs"
