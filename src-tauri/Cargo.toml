[package]
name = "mutagen"
version = "1.1.1"
edition = "2021"
description = "Mutagen — save editor for TMNT: Splintered Fate"

[lib]
name = "mutagen_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
mutagen-io = { path = "../crates/mutagen-io" }
